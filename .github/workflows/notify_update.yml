name: Notify Discord on Script Update

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install discord.js

      - name: Send Private Message to Admin
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          MY_USER_ID: '1449667262796660786'
        run: |
          node -e '
          const { Client, GatewayIntentBits, ActionRowBuilder, ButtonBuilder, ButtonStyle } = require("discord.js");
          const client = new Client({ intents: [GatewayIntentBits.Guilds, GatewayIntentBits.DirectMessages] });

          client.once("ready", async () => {
              try {
                  const user = await client.users.fetch(process.env.MY_USER_ID);
                  const row = new ActionRowBuilder().addComponents(
                      new ButtonBuilder()
                          .setCustomId("write_update_log")
                          .setLabel("✍️ Nhập Update Log để Đăng")
                          .setStyle(ButtonStyle.Success)
                  );

                  await user.send({
                      content: `🔔 **Sếp ơi! Vừa có cập nhật mới trên GitHub!**\n👤 Người sửa: \`${process.env.COMMIT_AUTHOR}\`\n📌 Commit: \`${process.env.COMMIT_MSG}\`\n\nBấm nút bên dưới để viết Update Log gửi lên kênh công khai nhé:`,
                      components: [row]
                  });
              } catch (err) {
                  console.error("Lỗi gửi tin riêng:", err);
                  process.exit(1);
              } finally {
                  client.destroy();
              }
          });

          client.login(process.env.DISCORD_BOT_TOKEN);
          '
